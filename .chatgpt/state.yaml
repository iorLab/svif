confirmed_constraints:
  - The canonical ZeroLocal repository is iorLab/zerolocal.
  - ANRD means AI-Native Repository Delivery and is the former name of ZeroLocal; do not treat it as a separate product or architecture.
  - GitHub is the canonical source of truth and RPM store for this project; chat is working memory only.
  - ZeroLocal means human local checkout, local project toolchain, git commands, and deployment CLI are not required for the normal supported lifecycle; optional local development is allowed.
  - Repository is the control plane for source, automation, migrations, docs, and durable project-operating state.
  - Human governs intent, judgment, authorization, account ownership, secrets, billing, and explicit production-risk approvals; agent executes implementation, verification, repair, and delivery within authorized boundaries.
  - CI verifies; Deploy actuates. Production delivery must preserve immutable revision provenance and, when gated by CI, deploy the exact validated revision.
  - Production deployment success requires observable verification such as endpoint/health/readiness checks; a successful deploy command alone is insufficient.
  - Secrets must remain in GitHub/provider secret stores and must never be requested in chat or stored in RPM/repository plaintext.
  - Provider-specific logic must remain behind provider adapters/skills rather than entering ZeroLocal Core contracts.
  - Cloudflare is the first reference provider only; v0.1 does not require broad multi-provider support.
  - iorLab/zerolocal-cloudflare-starter is the executable Cloudflare reference/golden fixture/conformance testbed, not the user entry point for ZeroLocal as a whole.
  - ZeroLocal Core Skill v0.1 implements Initialize -> Plan -> Implement -> Verify -> Deliver -> Observe -> Checkpoint while preserving the distinct protocol lifecycle.
  - Cloudflare Provider Skill v0.1 implements detect/capabilities/credentials/scaffold/validate/provision/migrate/deploy/endpoint/verify/recover and may delegate current provider mechanics to mature Cloudflare tools/skills.
  - Skill execution must be recoverable from repository state plus durable instructions/RPM and must not depend on founding chat history.
  - Before Plugin work begins, the skills must survive clean-room validation on multiple non-founding projects and common failure modes must have reusable classifications/recovery strategies.
  - The uploaded ZeroLocal development reference document v0.1 remains directional guidance, not canonical specification truth.
  - Validation #1 must not pre-seed target-project RPM bootstrap instructions in ChatGPT Project Instructions; ZeroLocal should establish or request them itself if its procedure requires them.
  - The current user environment is a personal Plus plan; current validation must not depend on Personal Skill upload/install being available in ChatGPT.
