confirmed_direction:
  - Svif is the new project/product identity; ZeroLocal and ANRD are predecessor identities.
  - Svif Core is execution-environment-independent and project-centered.
  - Agnir is an independent project-owned durable-continuity protocol and the dependency direction is Svif -> Agnir.
  - Svif depends on a compatible Agnir Core protocol version, not on a specific Agnir implementation, backend, adapter, Git repository layout, or ChatGPT integration.
  - The current draft dependency target is the Agnir Core 0.1 line; the exact release compatibility expression remains unfrozen.
  - The stable conceptual unit is the Project; Executors and execution environments may change.
  - Neutral Core roles are Principal and Executor. Execution Environment and Capability Adapter are first-class neutral concepts.
  - No execution environment becomes authoritative merely because work occurred there.
  - Fresh-context recovery is generalized to Agnir cold-start discovery / fresh-executor recovery.
  - The generalized Svif lifecycle is DISCOVER -> PLAN -> CHANGE -> VERIFY -> DELIVER -> OBSERVE -> CHECKPOINT, with REPAIR as the recovery loop.
  - DELIVER is skippable when no external actuation is required; software delivery may expand DELIVER into provisioning/deployment substates.
  - Stable candidate provenance replaces Git SHA as the Core abstraction. Immutable Git revision remains a strong software/SCM realization.
  - Evidence-driven transitions, verification/delivery authority separation, observable success, explicit trust boundaries, adapter isolation, and durable continuity remain Core invariants.
  - Canonical Git repository, remote-only operation, human-local-checkout prohibition, ChatGPT, Skills, and Cloudflare move out of Core into profiles/adapters/integrations or predecessor evidence.
  - CHECKPOINT delegates durable persistence/resumability semantics to Agnir and MUST NOT create a second competing memory model.
  - Secret values must remain inside authorized protected channels/stores; Svif Core must not require secret transfer through unprotected conversational or execution surfaces.
  - Existing ZeroLocal v0.1 validation evidence remains historical implementation evidence and MUST NOT be silently relabeled as Svif conformance.
  - Svif and Agnir remain separate canonical projects with independent durable state; one execution workspace may coordinate both.

legacy_constraints_retained_until_profile_migration:
  - CI verifies and deployment actuates in the ZeroLocal software-delivery predecessor model.
  - Exact validated Git revision provenance remains a strong software-delivery invariant pending formal profile extraction.
  - Provider-specific behavior remains outside provider-neutral Core semantics.
  - Production/external success requires observable verification when an external effect is claimed.

resolved_questions:
  - Svif should require Agnir Core protocol conformance, not an Agnir implementation and not a separately redefined Svif memory interface.
  - The target neutral role names are Principal and Executor.
  - Fresh-conversation/RPM bootstrap semantics map to Agnir cold-start discovery.
  - ZeroLocal PROVISION + DEPLOY collapse into generic Svif DELIVER at Core level; software delivery may re-expand them in a profile.
  - Git SHA becomes a profile-specific realization of the Core stable-candidate-provenance invariant.

open_questions:
  - What exact Agnir 0.1 release version/range Svif should declare after Agnir Core stabilizes.
  - Which ZeroLocal v0.1 requirements belong in the future Svif Software Delivery Profile versus generic Core.
  - What minimum machine-readable Capability Adapter descriptor Svif should standardize.
  - Whether PLAN is a normative lifecycle state in all Svif operations or a semantic phase that MAY be implicit for trivial work.
  - How conformance should express candidate identity requirements for mutable external systems that lack natural immutable revisions.
  - When to rename iorLab/zerolocal and iorLab/zerolocal-cloudflare-starter after migration compatibility is explicit.
  - How the external ChatGPT workspace registry should point to both Svif and Agnir without becoming shared mutable memory.

next_major_work:
  - tighten Agnir Core 0.1 Discovery Record and Locator Chain semantics in mattamior/rpm
  - draft explicit PPMP v2 -> Agnir 0.1 migration mapping
  - tighten SVIF_ARCHITECTURE_DRAFT.md into a normative Svif v0.2 draft
  - define the Svif Software Delivery Profile from retained ZeroLocal invariants
  - define machine-readable Capability Adapter semantics and failure contracts
  - freeze the Svif <-> Agnir compatibility declaration after Agnir Core stabilizes
  - migrate conformance identifiers and tests without relabeling predecessor evidence
  - rename files/repositories/integrations only after compatibility boundaries are documented
  - update the external multi-project workspace registry after repository-side discovery targets are explicit
  - resume Validation Project #2 against the Svif + Agnir contracts

