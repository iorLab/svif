summary: >-
  ZeroLocal is a repository-first, AI-operated software delivery system whose current development
  path is Specification -> executable provider reference -> Core Skill -> Provider Skill -> clean-room
  multi-project stabilization -> Plugin. The founding operating model was previously named ANRD
  (AI-Native Repository Delivery); ANRD is an old name for ZeroLocal, not a separate architecture.
  The immediate goal is not Plugin packaging. It is to stabilize the protocol and procedural skills
  so a fresh ChatGPT context plus repository state can execute the lifecycle without hidden founding
  context or a human-operated local checkout/toolchain.
current_focus: >-
  Complete ZeroLocal Specification v0.1 around protocol, roles, lifecycle, repository/RPM/CI/deployment/
  trust-boundary contracts, provider-neutral invariants, conformance requirements, and the Provider
  Adapter Contract. After the contract is sufficiently explicit, build the Cloudflare executable
  reference and use implementation pressure to refine the spec before encoding Core and Cloudflare
  procedural workflows as Skills.
