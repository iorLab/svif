  - draft platform-neutral Svif Core terminology and architecture
  - define Svif <-> Agnir dependency and discovery contract
  - design explicit migration of filenames, manifests, skills/adapters, conformance, and reference repositories
  - update ChatGPT workspace bootstrap/registry only after repository-side migration targets are explicit
  - resume Validation Project #2 against the new Svif/Agnir contract rather than the predecessor-only contract
