svif:
  version: "0.2"
  manifest: "project-binding/0.2"

project:
  identity: "urn:svif:project:svif-core"

bindings:
  continuity:
    provider: "agnir"
    compatibility: "0.1"
    config:
      discovery: "AGNIR.yaml"
  execution: []
  capabilities: []

profiles:
  - "software-delivery/0.2"

product:
  architecture: "ARCHITECTURE.md"
  runtime: "src/svif/runtime.py"
  agnir_repository_filesystem_adapter: "src/svif/continuity/agnir.py"
  chatgpt_execution_bridge: "src/svif/execution/chatgpt.py"
  cloudflare_workers_capability: "src/svif/capabilities/cloudflare.py"
  chatgpt_integration: "integrations/chatgpt/README.md"
  cloudflare_integration: "integrations/cloudflare/README.md"
  plugin_manifest: "plugin/plugin.json"
  plugin_skill: "plugin/skills/svif/SKILL.md"
  plugin_readme: "plugin/README.md"
  orchestration_contract: "spec/CORE.md"
  project_binding_contract: "spec/PROJECT_BINDING.md"
  capability_adapter_contract: "spec/CAPABILITY_ADAPTER.md"
  evidence_contract: "spec/EVIDENCE.md"

checks:
  repository_integrity: "checks/check_repository.py"
  portable_contracts: "conformance/check_contracts.py"
  runtime_kernel: "tests/test_runtime.py"
  agnir_continuity: "tests/test_agnir_continuity.py"
  chatgpt_surface: "tests/test_chatgpt_surface.py"
  cloudflare_capability: "tests/test_cloudflare_capability.py"
  founding_e2e: "tests/test_founding_e2e.py"
  plugin_package: "tests/test_plugin_package.py"

extensions:
  svif/repository:
    canonical: "iorLab/svif"
    authoritative_ref: "main"
    predecessor_ref: "legacy/zerolocal-v0.1"
