name: Verify pinned functional hardening once
on:
  push:
    branches: [fix/local-readiness]
    paths: [.github/workflows/readiness-verify-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the hash-verified locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d1bbdcbbb882df5ba136272c6144fcd0ca14f2bb
          test "$(git ls-remote origin refs/heads/fix/local-readiness | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = pathlib.Path('.github/readiness-patch')
          encoded = ''.join((parts / f'{i}.b64').read_text().strip() for i in range(6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '09de14549ab59b95f2c08f274ee0da136efc5984cb9a96544c4d3a1f030fe494'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm -r .github/readiness-patch .github/workflows/readiness-source-once.yml .github/workflows/readiness-verify-once.yml
          git add -A
          test "$(git write-tree)" = 9e5615b79fdb3acbde93155b73c16046a84f284f
          python checks/check_repository.py
          python conformance/check_contracts.py
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Persist verified candidate only to the staging branch
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/local-readiness | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce trusted authority and recoverable continuity'
          git push origin HEAD:refs/heads/fix/local-readiness
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\ntree=%s\nplugin=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD:plugin)" | tee "$RUNNER_TEMP/readiness-candidate.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: readiness-candidate-receipt
          path: ${{ runner.temp }}/readiness-candidate.txt
          retention-days: 14
  platform-tests:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.12'
          - os: windows-2022
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the exact candidate on this platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 9e5615b79fdb3acbde93155b73c16046a84f284f
          python checks/check_repository.py
          python conformance/check_contracts.py
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/readiness-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-tests-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/readiness-tests.log
          retention-days: 14
  native-install:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the official native Codex client in an isolated tools directory
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view @openai/codex version)"
          printf 'resolved_codex_npm_version=%s\n' "$version"
          npm install --prefix "$RUNNER_TEMP/native-tools" "@openai/codex@$version"
      - name: Observe exact native installation and new-process Skill discovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 9e5615b79fdb3acbde93155b73c16046a84f284f
          python checks/check_native_install.py --codex "$RUNNER_TEMP/native-tools/node_modules/.bin/codex" --output "$RUNNER_TEMP/native-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-native-install-receipt
          path: |
            ${{ runner.temp }}/native-acceptance/receipt.json
            ${{ runner.temp }}/native-acceptance/app-server.stderr.log
          if-no-files-found: warn
          retention-days: 14
