name: Apply native evidence matcher fix once
on:
  push:
    branches: [fix/local-readiness]
    paths: [.github/workflows/native-evidence-fix-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the locally verified candidate delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ce6954c73ef90ce8a419aacff5ac7aa1afc1e230
          test "$(git ls-remote origin refs/heads/fix/local-readiness | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = pathlib.Path('.github/native-evidence-fix.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0f91a7b581d8418c7f22ed5d733ae5e1f85fe6dff4debca824c9c4a4f85fa760'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          git rm .github/native-evidence-fix.b64 .github/workflows/native-evidence-fix-once.yml
          git add -A
          test "$(git write-tree)" = 34024c16a4ac15f97f801bfbdd02d8382ab1c6fe
          python checks/check_repository.py
          python conformance/check_contracts.py
          PYTHONPATH=src python -m unittest discover -s tests -v
          test "$(git ls-remote origin refs/heads/fix/local-readiness | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate namespaced native Skill evidence and retain readiness CI'
          git push origin HEAD:refs/heads/fix/local-readiness
          git rev-parse HEAD HEAD:plugin
