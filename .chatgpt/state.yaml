confirmed_direction:
  - The product/project identity is Svif; ZeroLocal and ANRD are historical names for the predecessor lineage.
  - Agnir is the project-owned durable-memory foundation used by Svif and is developed independently in mattamior/rpm.
  - Agnir MUST NOT require Git, GitHub, a repository host, ChatGPT, a conversational interface, or any particular AI agent.
  - Agnir memory belongs to the project and must be usable by any compatible reader/executor that can discover and interpret it.
  - Svif MUST NOT make ChatGPT, GitHub, Git, an AI-agent identity, local-vs-remote execution, or Skill packaging normative Core requirements.
  - The stable conceptual unit is the project; execution environments and executors may change.
  - No execution environment becomes authoritative merely because work occurred there.
  - Fresh-context recovery generalizes to cold-start/fresh-executor discovery rather than ChatGPT-specific fresh-conversation semantics.
  - Human Operator / Agent Operator terminology should be replaced by platform-neutral authority/execution roles such as Principal and Executor.
  - ChatGPT Skills, GitHub integration, Git persistence, local CLI, CI runners, and provider tools belong in implementations, adapters, profiles, or execution surfaces rather than protocol Core.
  - Svif and Agnir remain separate projects and canonical sources. Svif depends on Agnir; Agnir does not depend on Svif.
  - A single ChatGPT Project may act as a workspace for both projects, but each project must keep independent durable Agnir state.
  - Cross-project decisions are recorded in each affected project according to their local meaning; no shared mutable cross-project memory store is authoritative.
  - Workspace-level configuration should be locator/registry metadata only, not mutable project state.
  - Existing ZeroLocal v0.1 validation evidence remains valid as historical implementation evidence and must not be silently relabeled as Svif conformance.
legacy_constraints_retained_until_migrated:
  - CI verifies and deployment actuates; production success requires observable verification.
  - Exact validated-revision provenance remains a strong delivery invariant unless explicitly revised by the Svif specification.
  - Secrets must remain in protected stores and must never be requested in chat or persisted in plaintext project memory.
  - Provider-specific behavior remains outside provider-neutral Core semantics.
blockers: []
open_questions:
  - What exact Agnir protocol/version boundary Svif should require after the Agnir migration.
  - Whether Svif should require Agnir specifically or define a durable-continuity interface with Agnir as the normative/default realization.
  - Which ZeroLocal v0.1 invariants remain Svif Core invariants after removing repository, remote-only, Agent, and Skill assumptions.
  - What new neutral terminology should replace canonical repository, Agent Operator, Human Operator, fresh conversation, Core Skill, and Provider Skill.
  - What explicit migration/versioning strategy preserves ZeroLocal v0.1 evidence while establishing Svif's first generalized specification.
  - When to rename iorLab/zerolocal and iorLab/zerolocal-cloudflare-starter after architecture and compatibility boundaries are documented.
  - How the shared ChatGPT workspace registry should point to both Svif and Agnir without becoming a second memory store.
