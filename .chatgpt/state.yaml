project: ZeroLocal
status: active
phase: plugin-architecture-v0.1
repository: iorLab/zerolocal
product_form: installable-plugin
provider_references:
  cloudflare: iorLab/zerolocal-cloudflare-starter
founding_case_study: mattamior/awesome-fame-slider
updated_at: 2026-08-26
summary: >-
  ZeroLocal is being developed as an installable, provider-neutral orchestration plugin for
  repository-first AI-operated software development. A user should be able to install the plugin,
  state that a project should use ZeroLocal mode, and enter the ZeroLocal workflow without needing
  a local checkout or local project/deployment toolchain. Deployment provider selection is a
  separate step inside the flow; Cloudflare is the first provider-specific path. The founding
  awesome-fame-slider project demonstrated the operating model on GitHub Actions and Cloudflare.
current_focus: >-
  Define the ZeroLocal plugin architecture and provider-dispatch contract, then revise Specification
  v0.1 around that product model. Build the provider-neutral core flow first, define how provider
  adapters are selected and invoked, and use the Cloudflare reference repository as a golden fixture
  and conformance testbed rather than as the primary user entry point.
confirmed_constraints:
  - The canonical ZeroLocal repository is iorLab/zerolocal.
  - The target product form is an installable ChatGPT plugin/skill or equivalent installable orchestration package.
  - A user activates ZeroLocal through natural-language intent rather than by forking a provider starter.
  - ZeroLocal Core owns repository/RPM orchestration, remote validation, failure recovery, trust boundaries, provenance, and checkpoint behavior.
  - Deployment provider selection is separate from ZeroLocal activation and dispatches into a provider-specific flow.
  - Cloudflare is the first provider flow; iorLab/zerolocal-cloudflare-starter is its reference scaffold/golden fixture/conformance testbed.
  - The founding case study is mattamior/awesome-fame-slider.
  - GitHub is the canonical source of truth and RPM store for this project.
  - Chat conversations are working memory only; durable project state belongs in the repository.
  - ZeroLocal means local project tooling is not required for the human's normal workflow; it does not prohibit optional local development.
  - Secrets must remain in GitHub or provider secret stores and must never be requested in chat.
  - Provider-specific behavior must remain modular and outside the provider-neutral core.
implemented:
  - RPM manifest, state, next steps, and durable decisions initialized under .chatgpt/.
  - README.md and SPECIFICATION.md initialized for ZeroLocal v0.1.
  - Initial draft contains numbered ZeroLocal Core requirements plus provisional RPM and Continuous Delivery profiles.
  - Plugin-first, provider-second product architecture has been restored as the durable project direction.
  - Cloudflare starter role has been corrected from whole-product reference implementation to provider-flow reference/golden fixture/testbed.
blockers: []
open_questions:
  - Exact installable plugin package structure and skill boundaries for ZeroLocal Core.
  - Provider adapter contract: discovery, capability requirements, selection, initialization, deployment, verification, and recovery hooks.
  - Whether provider flows live inside the ZeroLocal plugin, as dependencies on provider plugins, or as a hybrid model.
  - Minimum machine-readable project manifest needed for ZeroLocal activation and provider dispatch.
  - Final conformance-level model and the relation between plugin behavior and repository/project conformance.
