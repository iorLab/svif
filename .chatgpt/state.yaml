summary: >-
  ZeroLocal v0.1 remains the historical validated implementation baseline. The project is now
  transitioning to Svif: an execution-environment-independent project operation protocol whose
  core semantics must not depend on ChatGPT, GitHub, Git, a local/remote distinction, a particular
  AI agent, or the ChatGPT Skill product form. Svif builds on Agnir for project-owned durable
  continuity. Agnir remains an independent project and may be used without Svif.
current_focus: >-
  Design and execute an explicit ZeroLocal -> Svif architecture migration together with the
  independent PPMP/PPM/Sandminni -> Agnir evolution. Preserve old validation evidence as historical
  evidence, remove platform/executor/storage assumptions from normative Core semantics, define the
  Svif-to-Agnir versioned boundary, and only then resume clean-room Validation Project #2 under the
  new architecture.
