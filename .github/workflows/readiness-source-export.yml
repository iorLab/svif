name: Readiness source export
on:
  push:
    branches: [fix/local-release-readiness]
    paths: [.github/workflows/readiness-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 960526544da308ea8b0eb1d325b26609487ab856
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar HEAD > "$RUNNER_TEMP/export/svif-source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/export/source-identity.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/export/source-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: svif-readiness-source-9605265
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 7
