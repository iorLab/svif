name: Apply verified bootstrap version-selection patch

on:
  push:
    branches:
      - fix/bootstrap-agnir-version-selection
    paths:
      - ".github/workflows/bootstrap-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bootstrap-agnir-version-selection
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path(".github/bootstrap-payload.txt").read_text(encoding="utf-8").strip()
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          print("patch_sha256=" + digest)
          assert digest == "c2e75891814da41d7bd933c1fb0b9edbdb078de0526d269e62dd72e919d6c056"
          Path("/tmp/bootstrap.patch").write_bytes(patch)
          PY
          git apply --index --binary /tmp/bootstrap.patch
          git rm .github/bootstrap-payload.txt
      - name: Verify full candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check --cached
          python checks/check_repository.py
          python conformance/check_contracts.py
          PYTHONPATH=src python -B -m unittest discover -s tests -v
      - name: Publish tested candidate to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: select Agnir bootstrap from Project truth"
          git push origin HEAD:refs/heads/fix/bootstrap-agnir-version-selection
