svif:
  version: "0.2"
  manifest: "project-binding/0.2"

project:
  identity: "urn:svif:project:svif-core"

bindings:
  continuity:
    provider: "agnir"
    compatibility: "0.1"
    config:
      discovery: "AGNIR.yaml"
  execution: []
  capabilities: []

profiles:
  - "software-delivery/0.2"

product:
  architecture: "ARCHITECTURE.md"
  runtime: "src/svif/runtime.py"
  orchestration_contract: "spec/CORE.md"
  project_binding_contract: "spec/PROJECT_BINDING.md"
  capability_adapter_contract: "spec/CAPABILITY_ADAPTER.md"
  evidence_contract: "spec/EVIDENCE.md"

checks:
  repository_integrity: "checks/check_repository.py"
  portable_contracts: "conformance/check_contracts.py"
  runtime_kernel: "tests/test_runtime.py"

extensions:
  svif/repository:
    canonical: "iorLab/svif"
    authoritative_ref: "main"
    predecessor_ref: "legacy/zerolocal-v0.1"
