  - Provider Adapter Contract shape: capabilities, dependencies, credential scopes, initialization, scaffolding, provisioning, deployment, endpoint discovery, verification, and recovery hooks.
  - Exact Core Skill procedural boundary and mapping from protocol lifecycle to agent operations Initialize/Plan/Implement/Verify/Deliver/Observe/Checkpoint.
