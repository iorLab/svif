name: Build accepted Svif submission bundle once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-submission-bundle-once.yml"

permissions:
  contents: read

jobs:
  build-submission-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert accepted Plugin tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD:plugin)"
          expected="5ab4b6147dbd096c052f042b23e37f0ec39f7091"
          printf 'plugin_tree=%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Build deterministic submission ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python checks/build_submission_bundle.py --output dist/svif-0.2.0.zip
          sha256sum dist/svif-0.2.0.zip | tee dist/svif-0.2.0.zip.sha256
          unzip -t dist/svif-0.2.0.zip
      - name: Upload exact submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: svif-0.2.0-openai-submission
          path: |
            dist/svif-0.2.0.zip
            dist/svif-0.2.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
