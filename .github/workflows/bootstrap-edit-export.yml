name: Export bootstrap edit source

on:
  push:
    branches:
      - fix/bootstrap-agnir-version-selection
    paths:
      - .github/workflows/bootstrap-edit-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bootstrap-agnir-version-selection
      - uses: actions/upload-artifact@v4
        with:
          name: svif-bootstrap-edit-source
          path: .
          include-hidden-files: true
          retention-days: 2
