agnir:
  version: "1.0"
  discovery_profile: "repository-filesystem/1.0"

project:
  identity: "urn:svif:project:svif-core"
  profiles:
    - generic

continuity:
  lineage: "urn:svif:lineage:authoritative"

memory:
  state: ".agnir/state.md"
  next_actions: ".agnir/next-actions.md"
  decisions: ".agnir/decisions.md"
  evidence: ".agnir/evidence/"

policy:
  checkpoint: event-driven

extensions:
  agnir/repository:
    canonical: "iorLab/svif"
    authoritative_ref: "main"
  agnir/vcs:
    branch_continuity: "lineage-bound"
    integration_reconciliation: "required"
    lineage_binding:
      kind: "vcs-ref"
      selector: "refs/heads/main"
  agnir/operations:
    distribution: "agnir-agent-skill"
    release: "1.0.0"
    source: "iorLab/agnir"
    applied_revision: "6d16dcfd17b8e9f22fd25804e22b9f8a516d06c3"
