summary: >-
  ZeroLocal v0.1 remains the historical validated implementation baseline. Svif is now defined
  as an execution-environment-independent project operation protocol. The transition architecture
  replaces Agent/Repository/remote-only/Skill assumptions with Project, Principal, Executor,
  Execution Environment, Agnir continuity, evidence-driven lifecycle semantics, and Capability
  Adapters. A separate Software Delivery Profile preserves strong ZeroLocal delivery invariants
  without making Git, CI location, ChatGPT, Skills, or Cloudflare universal Svif Core requirements.

current_focus: >-
  Reconcile the Svif Core architecture draft, Capability Adapter draft, Software Delivery Profile,
  and Agnir Core 0.1 discovery/migration drafts into testable normative boundaries. Finalize the
  PLAN-state rule, stable candidate/evidence envelope, adapter schema/versioning, and profile/Core
  split. Then introduce new Svif conformance identifiers/tests and revise Validation Project #2
  against the new contract before any broad repository/integration rename.

