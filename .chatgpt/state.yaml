summary: >-
  ZeroLocal v0.1 remains the historical validated implementation baseline. Svif is now defined
  as an execution-environment-independent project operation protocol. The current transition draft
  replaces Agent/Repository/remote-only/Skill assumptions with Project, Principal, Executor,
  Execution Environment, Agnir continuity, evidence-driven lifecycle semantics, and capability
  adapters. Svif depends normatively on the Agnir Core protocol rather than on any Agnir
  implementation/backend/adapter.

current_focus: >-
  Tighten SVIF_ARCHITECTURE_DRAFT.md and the parallel Agnir Core 0.1 draft into testable contracts.
  Define the Svif Software Delivery Profile that preserves the strongest ZeroLocal delivery
  invariants without making Git, repository, remote execution, ChatGPT, Skills, or Cloudflare
  universal Core requirements. Freeze the exact Svif-to-Agnir compatibility expression only after
  the Agnir 0.1 contract stabilizes, then migrate conformance and resume Validation Project #2.

