name: Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zerolocal-v0-1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python conformance/check_v0_1.py
