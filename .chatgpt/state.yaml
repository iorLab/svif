confirmed_direction:
  - Svif is the new project/product identity; ZeroLocal and ANRD are predecessor identities.
  - Svif Core is execution-environment-independent and project-centered.
  - Agnir is an independent project-owned durable-continuity protocol and the dependency direction is Svif -> Agnir.
  - Svif depends on a compatible Agnir Core protocol version, not on a specific Agnir implementation, backend, adapter, Git repository layout, or ChatGPT integration.
  - The current draft dependency target is the Agnir Core 0.1 line; the exact release compatibility expression remains unfrozen.
  - The stable conceptual unit is the Project; Executors and execution environments may change.
  - Neutral Core roles are Principal and Executor. Execution Environment and Capability Adapter are first-class neutral concepts.
  - No execution environment becomes authoritative merely because work occurred there.
  - Fresh-context recovery is generalized to Agnir cold-start discovery / fresh-executor recovery.
  - The generalized Svif lifecycle is DISCOVER -> PLAN -> CHANGE -> VERIFY -> DELIVER -> OBSERVE -> CHECKPOINT, with REPAIR as the recovery loop.
  - DELIVER is skippable when no external actuation is required; software delivery may expand DELIVER into PREPARE/PROVISION -> MIGRATE -> DEPLOY/PUBLISH.
  - Stable candidate provenance replaces Git SHA as the Core abstraction. Immutable Git revision remains a strong software/SCM realization.
  - Evidence-driven transitions, verification/delivery authority separation, observable success, explicit trust boundaries, adapter isolation, and durable continuity remain Core invariants.
  - Canonical Git repository, remote-only operation, human-local-checkout prohibition, ChatGPT, Skills, and Cloudflare move out of Core into profiles/adapters/integrations or predecessor evidence.
  - CHECKPOINT delegates durable persistence/resumability semantics to Agnir and MUST NOT create a second competing memory model.
  - Secret values must remain inside authorized protected channels/stores; Svif Core must not require secret transfer through unprotected conversational or execution surfaces.
  - Existing ZeroLocal v0.1 validation evidence remains historical implementation evidence and MUST NOT be silently relabeled as Svif conformance.
  - Svif and Agnir remain separate canonical projects with independent durable state; one execution workspace may coordinate both.
  - Capability Adapters declare capabilities, authority requirements, evidence semantics, failure classes, and retry/idempotency behavior without making provider/tool implementation details Core.
  - The initial adapter kinds are workspace, scm, verification, delivery, provider, observation, authority, and execution_surface.
  - Adapter composition must preserve candidate/artifact/delivery/observation provenance across boundaries.
  - The Software Delivery Profile preserves exact-verified-candidate delivery, protected delivery authority separation, state-sensitive concurrency safety, observable success, provider isolation, and evidence-based repair.
  - Predecessor ZeroLocal v0.1 is preserved on a dedicated legacy branch while main is the active Svif development line.

legacy_constraints_retained_as_predecessor_or_profile_evidence:
  - Remote CI was mandatory in ZeroLocal v0.1; Svif verification is execution-location-neutral.
  - Exact validated Git revision provenance remains a strong Software Delivery + SCM realization of stable candidate provenance.
  - Provider-specific behavior remains outside provider-neutral Core semantics.
  - Production/external success requires observable verification when an external effect is claimed.

resolved_questions:
  - Svif requires Agnir Core protocol conformance, not an Agnir implementation and not a separately redefined Svif memory interface.
  - The target neutral role names are Principal and Executor.
  - Fresh-conversation/RPM bootstrap semantics map to Agnir cold-start discovery.
  - ZeroLocal PROVISION + DEPLOY collapse into generic Svif DELIVER at Core level; the Software Delivery Profile may re-expand them.
  - Git SHA becomes a profile-specific realization of the Core stable-candidate-provenance invariant.
  - Provider Skill semantics map into a generic Capability Adapter plus optional execution-surface wrapper.
  - ZeroLocal software-delivery invariants are preserved in a separate Software Delivery Profile rather than copied wholesale into Svif Core.
  - The predecessor line is preserved outside main rather than forcing long-lived transition compatibility inside the active development branch.

open_questions:
  - What exact Agnir 0.1 release version/range Svif should declare after Agnir Core stabilizes.
  - Whether PLAN is mandatory as an explicit lifecycle state for trivial operations or may be implicit while its semantics remain required.
  - What exact standard evidence envelope should Capability Adapters exchange for candidate, artifact, delivery, target, and observation provenance.
  - Which adapter operation names are Core-normative versus profile-extensible.
  - How adapter schema/versioning handles wrappers around fast-changing third-party tools/providers.
  - How candidate identity should be expressed for mutable external systems without a natural immutable revision.
  - When to rename iorLab/zerolocal and iorLab/zerolocal-cloudflare-starter after migration compatibility is explicit.
  - How the external ChatGPT workspace registry should point to both Svif and Agnir without becoming shared mutable memory.

next_major_work:
  - freeze Agnir repository/filesystem discovery schema and cold-start conformance
  - settle Svif PLAN semantics and the standard candidate/evidence envelope
  - define versioned machine-readable Capability Adapter schema and conformance expectations
  - create new Svif conformance identifiers/tests rather than renaming ZL-* claims
  - revise Validation Project #2 success criteria for Svif Core + Software Delivery Profile + Agnir cold-start discovery
  - migrate Cloudflare reference into provider/profile implementation terminology while preserving historical evidence
  - rename files/repositories/integrations once new main-line contracts are executable and compatibility boundaries are documented
  - update external multi-project workspace registry after repository-side discovery targets are explicit

