agnir:
  version: "0.2"
  discovery_profile: "repository-filesystem/0.2"

project:
  identity: "urn:svif:project:svif-core"
  profiles:
    - generic

continuity:
  lineage: "urn:svif:lineage:agnir-core-0.2-parallel"

memory:
  state: ".agnir/state.md"
  next_actions: ".agnir/next-actions.md"
  decisions: ".agnir/decisions.md"
  evidence: ".agnir/evidence/"

policy:
  checkpoint: event-driven

extensions:
  agnir/repository:
    canonical: "iorLab/svif"
    authoritative_ref: "main"
  agnir/vcs:
    branch_continuity: "lineage-bound"
    integration_reconciliation: "required"
    lineage_binding:
      kind: "vcs-ref"
      selector: "refs/heads/feature/agnir-core-0.2-parallel"
  agnir/experiments:
    purpose: "svif-real-core-0.2-consumer-validation"
    source_revision: "414dba1e50ad1bdcae3ca91d19c6768fdaa030cc"
    forked_from_lineage: "urn:svif:lineage:agnir-core-0.2-validation"
    forked_from_revision: "329984f94483a7cbbb21a6faa42b9cf9ed84fed2"
  agnir/operations:
    distribution: "agnir-agent-skill"
    release: "0.2.0-dev"
    source: "iorLab/agnir"
    applied_revision: "414dba1e50ad1bdcae3ca91d19c6768fdaa030cc"
