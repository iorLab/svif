name: Repair Agnir 1.0 promotion stager

on:
  push:
    branches:
      - promotion/agnir-1.0
    paths:
      - .github/workflows/fix-promotion-stager.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: promotion/agnir-1.0

      - name: Repair stager after first complete-candidate test exposed stale guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/promote-agnir-1-0.yml')
          text = p.read_text(encoding='utf-8')

          def once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}')
              text = text.replace(old, new, 1)

          source = 'a00ad6ed9f18abddbed1979a619f932350cefe54'
          once('test "$(git rev-parse HEAD^)" = "a00ad6ed9f18abddbed1979a619f932350cefe54"', 'test "$(git merge-base HEAD origin/main)" = "a00ad6ed9f18abddbed1979a619f932350cefe54"')
          text = text.replace('git show HEAD^:AGNIR.yaml', f'git show {source}:AGNIR.yaml')
          text = text.replace('git show HEAD^:SVIF.yaml', f'git show {source}:SVIF.yaml')
          text = text.replace('git diff --quiet HEAD^ --', f'git diff --quiet {source} --')

          anchor = '          # Shared Skill: current self-host moves to 1.0; released Preview.1 bootstrap remains 0.1.\n'
          if text.count(anchor) != 1:
              raise SystemExit('shared Skill anchor mismatch')
          insertion = '''          # Plugin package guard follows the current self-host binding while preserving predecessor-ref rejection.\n          for old, new in [\n              (\'            \\\'version: "0.2"\\\',\\n\', \'            \\\'version: "1.0"\\\',\\n\'),\n              (\'            \\\'discovery_profile: "repository-filesystem/0.2"\\\',\\n\', \'            \\\'discovery_profile: "repository-filesystem/1.0"\\\',\\n\'),\n              (\'            \\\'compatibility: "0.2"\\\',\\n\', \'            \\\'compatibility: "1.0"\\\',\\n\'),\n              (\'            \\\'profile: "repository-filesystem/0.2"\\\',\\n\', \'            \\\'profile: "repository-filesystem/1.0"\\\',\\n\'),\n          ]:\n              replace("tests/test_plugin_package.py", old, new)\n\n'''
          text = text.replace(anchor, insertion + anchor, 1)

          once(
              'tests/test_agnir_continuity.py tests/test_agnir_stable_migration.py tests/test_plugin_agnir_discovery.py plugin/skills/svif/SKILL.md',
              'tests/test_agnir_continuity.py tests/test_agnir_stable_migration.py tests/test_plugin_agnir_discovery.py tests/test_plugin_package.py plugin/skills/svif/SKILL.md',
          )
          p.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/fix-promotion-stager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/promote-agnir-1-0.yml
          git commit -m "ci: repair Agnir 1.0 promotion staging"
          git push origin HEAD:promotion/agnir-1.0
